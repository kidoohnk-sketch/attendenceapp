<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />

    <title>My Chhota School - Attendance Portal</title>
    <meta name="description" content="A simple, premium Playschool Attendance portal for teachers to mark and owners to track daily attendance." />

    <!-- Favicons / PWA -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#4338ca" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Chhota School" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Social preview -->
    <meta property="og:title" content="My Chhota School - Attendance Portal" />
    <meta property="og:description" content="A simple, premium Playschool Attendance portal for teachers to mark and owners to track daily attendance." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpeg" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6fb;
        --card: #ffffff;
        --text: #1f1f28;
        --muted: #8a8a9a;
        --accent: #6366f1;
        --accent-2: #a78bfa;
        --spinner-track: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f14;
          --card: #17171f;
          --text: #f2f2f5;
          --muted: #7a7a8a;
          --accent: #818cf8;
          --accent-2: #c4b5fd;
          --spinner-track: #2a2a34;
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 45%),
          radial-gradient(circle at 80% 80%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 45%),
          var(--bg);
      }

      /* Splash content shown only while #root is empty (pre-React) */
      #root:empty::before {
        content: '';
        display: block;
        width: 56px;
        height: 56px;
        background-image: url('/logo.jpeg');
        background-size: cover;
        background-position: center;
        border-radius: 16px;
        box-shadow:
          0 8px 24px color-mix(in srgb, var(--accent) 25%, transparent),
          0 0 0 1px color-mix(in srgb, var(--accent) 15%, transparent);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.75; }
      }

      @media (prefers-reduced-motion: reduce) {
        #root:empty::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('Service Worker registered:', reg.scope))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
